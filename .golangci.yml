version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - wsl_v5
    - revive
    - gocritic
    - misspell
    - errorlint
    - gosec
    - unconvert
    - unparam
    - nolintlint
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

formatters:
  enable:
    - gofmt
    - goimports
